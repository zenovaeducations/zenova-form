<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenova Educations - Submissions</title>

    <link rel="stylesheet" href="vieww.css">
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="logo">ZENOVA</div>

            <h1>View Submissions</h1>

            <p>Authorized access only</p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password"
                autocomplete="off"
            >

            <button id="loginButton">
                Continue →
            </button>

            <div id="loginError"></div>

        </div>

    </section>


    <!-- =========================
         MAIN
    ========================== -->

    <main id="mainPage" class="main-page">

        <header class="header">

            <div>
                <div class="brand">
                    ZENOVA EDUCATIONS
                </div>

                <h1>SSLC 2026</h1>

                <p>Student Submissions</p>
            </div>

            <div class="total-card">

                <span>Total Students</span>

                <strong id="totalCount">
                    0
                </strong>

            </div>

        </header>


        <!-- =========================
             TOOLBAR
        ========================== -->

        <section class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search name, phone or village..."
            >

            <button id="addVillageButton">
                + Add Village
            </button>

            <button id="refreshButton">
                ↻ Refresh
            </button>

            <button id="excelButton">
                ↓ Excel
            </button>

            <button id="pdfButton">
                ↓ PDF
            </button>

        </section>


        <!-- =========================
             ADD VILLAGE AREA
        ========================== -->

        <section
            id="addVillageArea"
            class="add-village-area"
            style="display:none;"
        >

            <input
                type="text"
                id="villageNameInput"
                placeholder="Enter village name"
                autocomplete="off"
            >

            <button id="saveVillageButton">
                Save Village
            </button>

            <button id="cancelVillageButton">
                Cancel
            </button>

        </section>


        <!-- =========================
             TABLE
        ========================== -->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Phone</th>

                        <th>Whatsapp</th>

                        <th>SSLC Target %</th>

                        <th>Coming Tomorrow</th>

                        <th>Village Stop</th>

                        <!-- EXISTING VILLAGE -->
                        <th>Village</th>

                        <!-- NEW COLUMN -->
                        <th>Assigned Village</th>

                        <th>Delete</th>

                    </tr>

                </thead>

                <tbody id="submissionsTable">

                    <tr>

                        <td
                            colspan="10"
                            class="loading"
                        >
                            Loading submissions...
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>


        <div
            id="emptyMessage"
            class="empty-message"
        >
            No submissions found.
        </div>

    </main>


    <!-- Excel -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


    <!-- PDF -->

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>


    <!-- Main JS -->

    <script
        type="module"
        src="vieww.js"
    ></script>

</body>
</html>
